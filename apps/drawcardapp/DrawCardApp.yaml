# argocd/apps/myapp.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drawcardapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/changken/k3s-gitops
    targetRevision: main
    path: apps/drawcardapp
  destination:
    server: https://kubernetes.default.svc
    namespace: drawcardapp 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
