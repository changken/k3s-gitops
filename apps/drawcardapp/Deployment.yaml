apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawcardapp
  namespace: drawcardapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drawcardapp
  template:
    metadata:
      labels:
        app: drawcardapp
    spec:
      containers:
        - name: drawcardapp
          image: ghcr.io/changken/drawcardapp:fd5543db5a65e3e3d47f30bc8697723aba3e71c5 # CI 會更新這行
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
