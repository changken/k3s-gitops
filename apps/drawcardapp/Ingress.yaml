apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drawcardapp
  namespace: drawcardapp 
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: drawcardapp.changken.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drawcardapp
                port:
                  number: 80
  tls:
    - hosts:
        - drawcardapp.changken.net
      secretName: drawcardapp-tls
