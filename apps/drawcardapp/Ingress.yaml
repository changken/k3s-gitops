apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drawcardapp
  namespace: drawcardapp
spec:
  ingressClassName: traefik
  rules:
    - host: drawcardapp.changken.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drawcardapp
                port:
                  number: 80
