apiVersion: v1
kind: Service
metadata:
  name: argocd-server-ts
  namespace: argocd
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: changken-k3s-argocd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
    # argocd-server 預設把 HTTP 導向 https://<host>:443，因此 tailnet 也要提供 443
    - name: https
      port: 443
      targetPort: 8080
  type: ClusterIP
